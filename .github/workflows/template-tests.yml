name: template-tests
# Runs the scaffolded Astro template's own Playwright suite (every spec in its tests/
# folder) against a production build, so a change to
# the template can't silently ship a regression. In particular it exercises the seo.spec
# indexability guard (open robots.txt + llms.txt present), which the repo's only other
# workflow (`clean`, a PII/secrets scan) never touches. CI is set by Actions, so the
# Playwright config starts its own preview server (no reuseExistingServer).
on:
  push:
    paths:
      - 'skills/new-website/templates/astro/**'
      - 'skills/website-scorecard/**'
      - '.github/workflows/template-tests.yml'
  pull_request:
    paths:
      - 'skills/new-website/templates/astro/**'
      - 'skills/website-scorecard/**'
      - '.github/workflows/template-tests.yml'

defaults:
  run:
    working-directory: skills/new-website/templates/astro

jobs:
  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The template's publish classifier. It needs no build, no browser and no
      # network, so it runs first and fails in about a second. This step is the only
      # place it runs in THIS repo: the copy wired into the template's own ci.yml and
      # pre-push hook executes inside a scaffolded site, never here — so without this,
      # a regression in scripts/ship.sh would reach recipients with CI green.
      - name: Publish classifier (scripts/ship.sh)
        run: bash tests/check_ship_push.sh
      - uses: actions/setup-node@v4
        with:
          # The template pins its Node version; build/test on the same one Cloudflare uses.
          node-version-file: skills/new-website/templates/astro/.nvmrc
      - name: Install dependencies
        # The template's own package-lock.json IS committed (since 2026-07-09) — npm ci
        # for a reproducible install against that lockfile. This exercises the same
        # package.json/lockfile pinning as the "copy package.json and run npm install"
        # alternate path in templates/astro/README.md (conceptually, not literally — that
        # path runs `npm install`, this runs `npm ci`), NOT the primary npm-create-astro@latest
        # onboarding flow real recipients follow — see docs/reviews/REVIEW-plan-2026-07-16-astro7-upgrade-r1.md
        # for that known gap (tracked as a separate follow-up, not fixed by this change).
        run: npm ci --no-audit --no-fund
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run template test suite
        run: npm test

  # The website-scorecard skill ships three files that live in a SITE, never in the
  # starter, so the job above does not run them. This builds a site from the starter,
  # installs the skill the way its SKILL.md §2 says, writes a card and runs the suite
  # with it. A starter change that breaks those files (they lean on src/config.ts, the
  # Base layout, the Playwright config and its JSON report) turns red here.
  scorecard-skill:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: skills/new-website/templates/astro/.nvmrc
      - name: A site from the starter, with the skill installed
        run: |
          cp -R "$GITHUB_WORKSPACE/skills/new-website/templates/astro" site && cd site
          K="$GITHUB_WORKSPACE/skills/website-scorecard/templates"
          cp "$K/scorecard.mjs" scripts/ && cp "$K/Scorecard.astro" src/components/ && cp "$K/scorecard.spec.ts" tests/
          npm pkg set scripts.scorecard="node scripts/scorecard.mjs"
          sed -i "s|const PAGE = '';|const PAGE = '/';|" tests/scorecard.spec.ts
          sed -i "s|^import { SITE } from '../config';|import { SITE } from '../config';\nimport Scorecard from '../components/Scorecard.astro';|" src/pages/index.astro
          sed -i 's|^</Base>|  <div class="wrap"><Scorecard /></div>\n</Base>|' src/pages/index.astro
          grep -q "const PAGE = '/';" tests/scorecard.spec.ts && grep -q '<Scorecard />' src/pages/index.astro && grep -q "import Scorecard" src/pages/index.astro
          printf 'node_modules\ndist\n.astro\ntest-results\n' > .gitignore
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          git init -q && git config user.name ci && git config user.email ci@example.invalid
          git add -A && git commit -q -m "a site with the scorecard skill"
      - name: Type check, write the card, run the suite with it
        working-directory: ${{ runner.temp }}/site
        run: |
          npm run check
          npm run scorecard
          git add scorecard.json && git commit -q -m "scorecard"
          npm run scorecard -- --lighthouse 90,91,92,93 --date 2026-01-01
          git add scorecard.json && git commit -q -m "scores"
          npm test
          grep -q 'data-state="current"' dist/index.html
      # The card's totals against Playwright's own summary, from a second run with another
      # reporter: the script reads the JSON report, this reads the lines Playwright
      # prints. So a change in the JSON report's shape that made the script miscount
      # turns red here. The card leaves out its own spec, whose tests all sit that run out.
      - name: The card's totals are Playwright's totals
        working-directory: ${{ runner.temp }}/site
        run: |
          out="$(SCORECARD_RUN=1 CI= npx playwright test --reporter=line 2>&1 | tail -n 8)"
          echo "$out"
          passed="$(printf '%s\n' "$out" | sed -n 's/^ *\([0-9][0-9]*\) passed.*/\1/p')"
          skipped="$(printf '%s\n' "$out" | sed -n 's/^ *\([0-9][0-9]*\) skipped.*/\1/p')"
          own="$(grep -c "^test('" tests/scorecard.spec.ts)"
          node -e '
            const card = JSON.parse(require("fs").readFileSync("scorecard.json", "utf8"));
            const [passed, skipped, own] = process.argv.slice(1).map(Number);
            const line = `card: ${card.passed} passed, ${card.skipped} skipped. Playwright: ${passed} passed, ${skipped} skipped, ${own} of them the tests of the card itself.`;
            if (!(passed > 0) || card.passed !== passed || card.skipped !== skipped - own) { console.error("::error::" + line); process.exit(1); }
            console.log("agree. " + line);
          ' "$passed" "$skipped" "$own"
      # The three ways a run has to be refused, each against a real Playwright report:
      # the script's own arithmetic is pinned in its spec, this pins what Playwright
      # hands it. Each case is committed (the script wants a clean tree), must make
      # `npm run scorecard` fail, must leave scorecard.json alone, and is then undone.
      - name: A red run writes no card
        working-directory: ${{ runner.temp }}/site
        run: |
          before="$(sha256sum scorecard.json)"
          refused() {
            git add -A && git commit -q -m "$1"
            if npm run scorecard; then echo "::error::$1: the run was accepted"; exit 1; fi
            [ "$(sha256sum scorecard.json)" = "$before" ] || { echo "::error::$1: scorecard.json changed"; exit 1; }
            git reset -q --hard HEAD~1
          }
          printf 'this is not typescript (((\n' > tests/broken.spec.ts
          refused "a spec file that cannot load"
          sed -i '0,/^  test(/s//  test.only(/' tests/links.spec.ts && grep -q '^  test.only(' tests/links.spec.ts
          refused "a stray test.only"
          sed -i 's|<p>Contact:|<p>FIXME</p><p>Contact:|' src/pages/index.astro && grep -q 'FIXME' src/pages/index.astro
          refused "a failing test"
          [ -z "$(git status --porcelain)" ]

name: clean
# Fails the build if any personal name, contact info, or credential enters the skill
# suite (see scripts/check_clean.sh), or if a concrete model name/tag creeps into
# independent-review's pipeline files — that skill is model-agnostic and lets the
# owner's own CLI config/signin choose the models (see scripts/check_model_defaults.sh).
on:
  push:
  pull_request:
jobs:
  no-pii-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan skills for names / contact info / credentials
        run: bash scripts/check_clean.sh
  model-defaults:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check independent-review stays model-agnostic
        run: bash scripts/check_model_defaults.sh
